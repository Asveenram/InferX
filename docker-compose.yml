version: '3.8'

services:
  worker1:
    build: ./worker
    environment:
      - WORKER_ID=worker-1

  worker2:
    build: ./worker
    environment:
      - WORKER_ID=worker-2

  worker3:
    build: ./worker
    environment:
      - WORKER_ID=worker-3

  load_balancer:
    build: ./load_balancer
    ports:
      - "8000:8000"
    depends_on:
      - worker1
      - worker2
      - worker3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - load_balancer

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus